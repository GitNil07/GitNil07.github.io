<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Q ring -->
  <circle cx="100" cy="100" r="70"
          fill="none"
          stroke="black"
          stroke-width="10"/>

  <!-- Q tail -->
  <line x1="128" y1="128" x2="165" y2="165"
        stroke="black"
        stroke-width="10"
        stroke-linecap="round"/>

  <!-- N (inside Q) -->
  <path d="M70 140 V60 L130 140 V60"
        fill="none"
        stroke="black"
        stroke-width="12"
        stroke-linecap="round"
        stroke-linejoin="round"/>
</svg>
