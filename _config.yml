# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'jekyll serve'. If you change this file, please restart the server process.

# Site settings
title:       Nil’s Quantum Dreams
email:       ''
description: 'Nil’s Quantum Dreams — my work at the intersection of intelligence, elegance, art, systems, and ambition.'
baseurl:     '' # The subpath of your site, e.g. /blog
url:         'https://gitnil07.github.io' # The base hostname & protocol for your site
twitter:     'digitaldreams08'
github:     'https://github.com/GitNil07'
linkedin: 'https://www.linkedin.com/in/nilormidasdigitaldreams/'

markdown:  kramdown
permalink: pretty
paginate:  60

sass:
  style: compressed

gems:
  - jekyll-paginate
  - jekyll/tagging

include:
  - _pages
  - _site/tag

exclude:
  - vendor
  - Gemfile
  - Gemfile.lock

# Tags
tag_page_dir:         tag
tag_page_layout:      tag_page
tag_permalink_style:  pretty

# Pages path
defaults:
  - scope:
      path: '_pages'
    values:
      permalink: /:basename:output_ext

plugins:
  - jekyll-feed

